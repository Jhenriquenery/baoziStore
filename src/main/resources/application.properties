# ==========================================================
# Baozi Store - configuração do banco de dados
# ==========================================================

# ---------- OPÇÃO 1 (padrão): H2 em memória ----------
# Não precisa instalar nada. Os dados somem ao reiniciar a aplicação.
spring.datasource.url=jdbc:h2:mem:baozidb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------- OPÇÃO 2: MySQL ----------
# Para usar o MySQL: comente as linhas da OPÇÃO 1 acima, descomente as abaixo
# e crie o banco antes:  CREATE DATABASE baozi_store;
#spring.datasource.url=jdbc:mysql://localhost:3306/baozi_store?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.datasource.username=root
#spring.datasource.password=SUA_SENHA

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

server.port=8080
